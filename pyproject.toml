[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qsc-bench"
version = "1.0.0"
description = "Neutral time-to-contract benchmarks for drifting hybrid quantum systems"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.1,<3",
  "pydantic>=2.10,<3",
  "qiskit>=2.1,<3",
  "qiskit-aer>=0.17,<0.18",
]

[project.optional-dependencies]
metriq = ["metriq-gym>=0.7,<0.8"]

[project.scripts]
qsc-bench = "qsc_bench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["qsc_bench*"]
